[package]
name = "multiway-solver"
version = "0.1.0"
edition = "2021"
# Oldest toolchain that builds the locked dependencies (rayon needs 1.80);
# checked with `cargo +1.80 check`.
rust-version = "1.80"
authors = ["Bo Chi", "Yulin Zhang", "Chudi Zhong", "Cynthia Rudin"]
description = "Native search and factored Rashomon sets for SPLINTER multiway decision trees"
license = "MIT"
repository = "https://github.com/frankyzha/SPLINTER"
readme = "README.md"
keywords = ["decision-tree", "interpretable-ml", "rashomon-set", "machine-learning", "multiway-split"]
categories = ["science", "algorithms"]

[lib]
name = "multiway_solver"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = "0.16"
rayon = "1.10"
dashmap = "6.1.0"
# Lock-free append-only Vec for the MemoKey arena (reads take no lock).
boxcar = "0.2"
# Faster hasher than the default SipHash for the memo and leaf-dedup HashMaps.
rustc-hash = "2"
# Optional mimalloc global allocator (`--features mimalloc-allocator`); off by
# default because it can conflict with allocator-sensitive Python C extensions.
mimalloc = { version = "0.1", optional = true }
# Optional jemalloc global allocator (`--features alt-allocator`).
tikv-jemallocator = { version = "0.5", optional = true }
# Inline storage for a FactoredSplit's child references; larger arities spill
# to the heap.
smallvec = { version = "1.15", features = ["union"] }
# Per-stream DEFLATE compression for the v6 DAG file format (pure-Rust backend).
flate2 = "1"

[features]
default = ["python"]
python = ["pyo3", "numpy"]
# Allocator opt-ins (default = system allocator).
mimalloc-allocator = ["dep:mimalloc"]
alt-allocator = ["dep:tikv-jemallocator"]

[profile.release]
# Full LTO and a single codegen unit, so hot helpers inline across modules.
lto = "fat"
codegen-units = 1
debug = false
